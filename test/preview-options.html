<!doctype html>
<html><head><meta charset="utf-8"><title>Options preview</title>
<link rel="stylesheet" href="../src/options/options.css"></head>
<body>
  <script src="chrome-stub.js"></script>
  <script>
  // Pull the real options markup in so this preview cannot drift from it.
  window.__stubReady
    .then(() => fetch('../src/options/options.html').then((r) => r.text()))
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      document.body.appendChild(doc.querySelector('main'));
      return Promise.all(
        ['../src/common/services.js', '../src/common/settings.js', '../src/options/options.js']
          .reduce((chain, src) => chain.then(() => new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = src; s.onload = res; s.onerror = rej;
            document.body.appendChild(s);
          })), Promise.resolve())
      );
    });
  </script>
</body></html>
